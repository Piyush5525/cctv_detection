# Scripted demo events (fall, violence, snatching).
#
# These incidents are SCRIPTED: the demo script creates them from your clips. NO detector runs on the clips, nothing is scored,
# and the dashboard, Telegram caption and call text all say "SCRIPTED DEMO". Use them only to show the flow
# (map -> evidence -> dispatch -> Telegram -> call), never as proof that a detector works.
#
# The seconds below were chosen by looking at a contact sheet of each clip (fall.mp4 20.05 s, violence.mp4 19.43 s, snatch.mp4 30.0 s).
# Adjust them if you want a different moment. Putting "REPLACE_ME: true" back on its own line disables all three again.
#
# Per class:
#   clip           path inside data/demo/
#   event_start_s  where the event starts (the clip also includes up to 8 pre-event seconds before this)
#   event_end_s    where the event ends
#   best_frame_s   the frame shown as the photo; must be inside [event_start_s, event_end_s]
#   place_note     optional free text kept in the evidence note
# Values must fit the clip: 0 <= event_start_s < event_end_s <= clip length.

fall:
  clip: data/demo/fall.mp4
  event_start_s: 3.0          # person is still walking at the door; the fall is at about 3.5-4.5 s
  event_end_s: 12.0
  best_frame_s: 6.0           # person clearly on the ground

violence:
  clip: data/demo/violence.mp4
  event_start_s: 0.5          # two people already grappling
  event_end_s: 16.0
  best_frame_s: 6.0

snatching:
  clip: data/demo/snatch.mp4
  event_start_s: 1.5          # bike snatchers reach the woman at about 2 s
  event_end_s: 11.0           # she pulls one down, he escapes
  best_frame_s: 4.0
